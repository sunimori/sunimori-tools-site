<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Java Impact Analyzer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfd;  --glow: 60 118 190;
    --card: #ffffff;  --sunk: #f2f4f8;  --raise: #ffffff;
    --line: rgba(16, 24, 40, .10);  --line-2: rgba(16, 24, 40, .06);
    --ink: #101319;  --ink-2: #4a525d;  --ink-3: #838b97;
    --accent: #2b61a7;  --accent-2: #3f7fd0;  --wash: rgba(63, 127, 208, .10);
    --ok: #157a49;  --warn: #8f5c0c;
    --lift: 0 1px 2px rgba(16,24,40,.04), 0 14px 34px -22px rgba(16,24,40,.35);
    --r: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e12;  --glow: 122 176 236;
      --card: #12161c;  --sunk: #0e1218;  --raise: #161b22;
      --line: rgba(255, 255, 255, .09);  --line-2: rgba(255, 255, 255, .05);
      --ink: #eaeef4;  --ink-2: #a3acb9;  --ink-3: #737d8a;
      --accent: #7fb4ef;  --accent-2: #9dc9fa;  --wash: rgba(127, 180, 239, .12);
      --ok: #5ec288;  --warn: #d8a544;
      --lift: 0 1px 0 rgba(255,255,255,.03) inset;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
          "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans KR", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto 0; height: 620px; pointer-events: none; z-index: 0;
    background:
      radial-gradient(48% 58% at 50% -10%, rgb(var(--glow) / .17), transparent 66%),
      radial-gradient(26% 36% at 12% 2%, rgb(var(--glow) / .07), transparent 70%),
      radial-gradient(26% 36% at 88% 6%, rgb(var(--glow) / .06), transparent 70%);
  }
  .shell { position: relative; z-index: 1; }

  /* 幅は固定しない。器は画面に合わせて伸び、読み物だけ別に上限を持つ */
  .bound { width: min(1400px, 100%); margin: 0 auto; padding-inline: clamp(20px, 4vw, 52px); }

  /* ── 帯 ── */
  .bar {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: saturate(1.8) blur(14px);
    border-bottom: 1px solid transparent; transition: border-color .2s;
  }
  .bar.stuck { border-bottom-color: var(--line); }
  .bar .bound { display: flex; align-items: center; gap: 11px; height: 64px; }
  .mark {
    width: 32px; height: 32px; flex: none; border-radius: 10px; color: #fff;
    background: linear-gradient(148deg, var(--accent-2), var(--accent));
    display: grid; place-items: center; box-shadow: 0 4px 12px -4px rgb(var(--glow) / .6);
  }
  .mark svg { width: 18px; height: 18px; }
  .brand { font-weight: 600; letter-spacing: -.012em; }
  .grow { flex: 1; }

  /* ── 言語 ── */
  .lang { position: relative; }
  .lang-btn {
    display: flex; align-items: center; gap: 6px; font: inherit; font-size: 13px;
    color: var(--ink-2); cursor: pointer; background: transparent;
    border: 1px solid var(--line); border-radius: 11px; padding: 7px 11px;
    transition: border-color .16s, color .16s, background .16s;
  }
  .lang-btn:hover { color: var(--ink); background: var(--card); border-color: var(--ink-3); }
  .lang-btn > svg:first-child { width: 16px; height: 16px; }
  .lang-btn .chev { width: 12px; height: 12px; opacity: .55; transition: transform .18s; }
  .lang-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .lang-menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 50; min-width: 188px; padding: 6px;
    background: var(--raise); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 14px 40px -12px rgba(6, 10, 16, .45); display: none;
  }
  .lang-menu.open { display: block; }
  .lang-menu button {
    display: flex; align-items: center; gap: 9px; width: 100%; font: inherit; font-size: 14px;
    text-align: left; cursor: pointer; color: var(--ink-2); background: none; border: 0;
    border-radius: 10px; padding: 8px 10px;
  }
  .lang-menu button:hover { background: var(--sunk); color: var(--ink); }
  .lang-menu button[aria-checked="true"] { color: var(--accent); font-weight: 600; }
  .lang-menu .tick { width: 14px; height: 14px; flex: none; opacity: 0; }
  .lang-menu button[aria-checked="true"] .tick { opacity: 1; }
  .lang-menu .sub { margin-left: auto; font-size: 11px; color: var(--ink-3); letter-spacing: .05em; }

  /* ── 冒頭 ── */
  .hero { text-align: center; padding: clamp(56px, 9vw, 104px) 0 clamp(30px, 4vw, 46px); }
  h1 {
    font-size: clamp(36px, 6vw, 60px); line-height: 1.04; letter-spacing: -.036em;
    font-weight: 660; margin: 0 0 18px;
    background: linear-gradient(180deg, var(--ink), color-mix(in srgb, var(--ink) 68%, var(--bg)));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lede {
    font-size: clamp(15.5px, 1.5vw, 18px); line-height: 1.62; color: var(--ink-2);
    margin: 0 auto; max-width: 60ch;
  }

  /* 主役: 更新サイトの URL。冒頭のすぐ下に、入力欄の顔で置く */
  .cta { margin: clamp(26px, 3.4vw, 38px) auto 0; max-width: 720px; }
  .field {
    position: relative; display: flex; align-items: center;
    background: var(--sunk); border: 1px solid var(--line);
    border-radius: 13px; transition: border-color .16s;
  }
  .field:hover, .field:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .field code {
    flex: 1; min-width: 0; padding: 13px 52px 13px 16px; overflow-x: auto; text-align: left;
    white-space: nowrap; color: var(--ink);
    font: 13.5px/1.6 ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  .field.wrap code { white-space: pre; }
  .ghost {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; flex: none; display: grid; place-items: center; cursor: pointer;
    color: var(--ink-3); background: transparent; border: 1px solid transparent; border-radius: 9px;
    transition: color .15s, background .15s, border-color .15s;
  }
  .ghost:hover { color: var(--ink); background: var(--card); border-color: var(--line); }
  .ghost svg { width: 16px; height: 16px; }
  .ghost .ic-done { display: none; }
  .ghost.done { color: var(--ok); }
  .ghost.done .ic-copy { display: none; }
  .ghost.done .ic-done { display: block; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font: 11.5px/1 ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    color: var(--ink-3); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 12px;
  }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 32%, transparent); }
  .pill svg { width: 13px; height: 13px; }

  /* ── 格子: 列の数は画面が決める ── */
  .grid { display: grid; gap: clamp(14px, 1.4vw, 20px); align-items: start; }
  .grid + .grid { margin-top: clamp(14px, 1.4vw, 20px); }
  .grid.wide { grid-template-columns: repeat(auto-fit, minmax(min(430px, 100%), 1fr)); }
  .grid.slim { grid-template-columns: repeat(auto-fit, minmax(min(268px, 100%), 1fr)); }
  .grid > * { min-width: 0; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: clamp(20px, 2vw, 26px); box-shadow: var(--lift);
    transition: border-color .18s, transform .18s;
  }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 26%, var(--line)); }
  .ch { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
  .ci {
    width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center;
    color: var(--accent); background: var(--wash);
  }
  .ci svg { width: 16px; height: 16px; }
  h2 { font-size: 16.5px; letter-spacing: -.012em; font-weight: 620; margin: 0; }
  p { margin: 0 0 11px; color: var(--ink-2); }
  p:last-child { margin-bottom: 0; }
  p strong, li strong { color: var(--ink); font-weight: 600; }
  .muted { color: var(--ink-3); font-size: 13px; }
  code.i {
    background: var(--sunk); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 5px;
    font: 12.5px ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    color: var(--ink); word-break: break-all;
  }
  .card .field { margin-top: 12px; }

  /* ── 手順 ── */
  ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; }
  ol.steps li { counter-increment: s; position: relative; padding: 0 0 16px 34px; color: var(--ink-2); }
  ol.steps li::before {
    content: counter(s); position: absolute; left: 0; top: 1px;
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; font-weight: 650; color: var(--accent); background: var(--wash);
  }
  ol.steps li::after {
    content: ""; position: absolute; left: 10.5px; top: 26px; bottom: 3px; width: 1px;
    background: var(--line);
  }
  ol.steps li:last-child { padding-bottom: 0; }
  ol.steps li:last-child::after { display: none; }

  /* ── 但し書き ── */
  .note {
    display: flex; gap: 10px; margin-top: 14px; padding: 12px 14px; font-size: 13.5px;
    color: var(--ink-2); background: color-mix(in srgb, var(--warn) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 22%, transparent); border-radius: 12px;
  }
  .note svg { width: 15px; height: 15px; flex: none; margin-top: 4px; color: var(--warn); }

  a { color: var(--accent); text-decoration-color: color-mix(in srgb, var(--accent) 38%, transparent);
      text-underline-offset: 2px; }
  a:hover { text-decoration-color: currentColor; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .tail { height: clamp(60px, 8vw, 120px); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

        <p data-i18n="hardenBody"></p>

  LANGS.forEach(function (l) {
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "menuitemradio");
    b.dataset.lang = l.id;
    b.innerHTML = TICK + '<span>' + l.name + '</span><span class="sub">' + l.tag + '</span>';
    b.addEventListener("click", function () { pick(l.id); close(); btn.focus(); });
    menu.appendChild(b);
  });

  function apply(lang) {
    var t = T[lang] || T.en;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var v = t[el.getAttribute("data-i18n")];
      if (v != null) { el.innerHTML = v; }
    });
    // 絵だけの釦は、題名で何をする物か伝える
    document.querySelectorAll("[data-i18n-title]").forEach(function (el) {
      var v = t[el.getAttribute("data-i18n-title")];
      if (v != null) { el.title = v; el.setAttribute("aria-label", v); }
    });
    var meta = LANGS.filter(function (l) { return l.id === lang; })[0];
    now.textContent = meta ? meta.name : lang;
    menu.querySelectorAll("button").forEach(function (b) {
      b.setAttribute("aria-checked", String(b.dataset.lang === lang));
    });
  }

  function pick(lang) {
    current = lang;
    apply(lang);
    try { localStorage.setItem("st.lang", lang); } catch (e) { /* 保存できなくても使える */ }
  }

  function open() { menu.classList.add("open"); btn.setAttribute("aria-expanded", "true"); }
  function close() { menu.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }

  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (menu.classList.contains("open")) { close(); } else { open(); }
  });
  document.addEventListener("click", function (e) {
    if (!menu.contains(e.target) && !btn.contains(e.target)) { close(); }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { close(); } });

  // 起動時の言語: 前回の選択 → 閲覧環境の設定 → 日本語
  var saved = null;
  try { saved = localStorage.getItem("st.lang"); } catch (e) { /* 同上 */ }
  if (!saved) {
    var nav = (navigator.languages || [navigator.language || "ja"]).join(",").toLowerCase();
    var hit = LANGS.filter(function (l) { return nav.indexOf(l.id) >= 0; })[0];
    saved = hit ? hit.id : "ja";
  }
  pick(saved);

  // 帯は、少しでも巻いたら下辺の線を出す。常に出しておくと、
  // 一番上に居る時に画面を無意味に二分してしまう
  var bar = document.getElementById("bar");
  var onScroll = function () { bar.classList.toggle("stuck", window.scrollY > 4); };
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  // ---- 写す釦 ----
  document.querySelectorAll("[data-copy]").forEach(function (b) {
    b.addEventListener("click", function () {
      var src = document.getElementById(b.getAttribute("data-copy"));
      var text = src.textContent.replace(/\s*\n\s*/g, " ").trim();
      var done = function () {
        b.classList.add("done");
        setTimeout(function () { b.classList.remove("done"); }, 1400);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        // 古い環境。選んだ状態にして手で写せるようにするだけでも意味がある
        var r = document.createRange();
        r.selectNodeContents(src);
        var s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
        done();
      }
    });
  });
})();
</script>
</body>
</html>
