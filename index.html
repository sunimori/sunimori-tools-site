<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Java Impact Analyzer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfc;
    --glow: 47 109 179;
    --surface: #ffffff;
    --surface-2: #f4f6f8;
    --line: #e4e7ec;
    --line-soft: #eef0f4;
    --ink: #14171b;
    --ink-2: #4c545e;
    --ink-3: #838b96;
    --accent: #2c62a8;
    --accent-2: #3f7fd0;
    --accent-wash: #eef4fc;
    --ok: #1f7a4d;
    --warn: #9a6414;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 8px 24px -12px rgba(16, 24, 40, .12);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --glow: 110 168 232;
      --surface: #161a20;
      --surface-2: #1b2027;
      --line: #262c35;
      --line-soft: #1f242b;
      --ink: #e9ecf1;
      --ink-2: #a8b1bd;
      --ink-3: #78828f;
      --accent: #7cb3f0;
      --accent-2: #9ac8fa;
      --accent-wash: #16212e;
      --ok: #63c48d;
      --warn: #d9a63f;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
          "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans KR",
          "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -20vh 0 auto 0;
    height: 60vh;
    background: radial-gradient(60% 55% at 50% 0%, rgb(var(--glow) / .13), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  /* ---------- 版面 ----------
     広い画面では左に「まず要る物」(名前・版・更新サイトの URL)を貼り付け、
     右に読み物を流す。1 本の細長い帯にすると、画面の大半が余白になる一方で
     文章は却って読みにくい ―― 幅は<b>用途で分ける</b>。 */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: saturate(1.6) blur(10px);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    border-bottom: 1px solid transparent;
    transition: border-color .2s;
  }
  .topbar.stuck { border-bottom-color: var(--line); }
  .topbar-inner {
    max-width: 1160px; margin: 0 auto; padding: 14px 32px;
    display: flex; align-items: center; gap: 12px;
  }
  .wrap {
    position: relative; z-index: 1;
    max-width: 1160px; margin: 0 auto; padding: 0 32px 120px;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 0;
  }
  @media (min-width: 1000px) {
    .wrap {
      grid-template-columns: 360px minmax(0, 1fr);
      column-gap: 72px;
      align-items: start;
    }
    .rail { position: sticky; top: 72px; padding-top: 56px; }
    .main { padding-top: 56px; }
    .main > section:first-child { margin-top: 0; }
  }
  @media (max-width: 999px) {
    .topbar-inner, .wrap { padding-left: 24px; padding-right: 24px; }
    .rail { padding-top: 34px; }
  }

  header { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 34px; height: 34px; flex: none; border-radius: 9px;
    background: linear-gradient(150deg, var(--accent-2), var(--accent));
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 2px 8px -2px rgb(var(--glow) / .5);
  }
  .mark svg { width: 19px; height: 19px; }
  .brand { font-weight: 600; letter-spacing: -.01em; }
  .spacer { flex: 1; }

  /* ---------- 言語の落とし込み ---------- */
  .lang { position: relative; flex: none; }
  .lang-btn {
    display: flex; align-items: center; gap: 6px;
    font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 10px; transition: border-color .15s, color .15s;
  }
  .lang-btn:hover { color: var(--ink); border-color: var(--ink-3); }
  .lang-btn > svg:first-child { width: 16px; height: 16px; flex: none; }
  .lang-btn .chev { width: 12px; height: 12px; opacity: .6; transition: transform .18s; }
  .lang-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .lang-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 20;
    min-width: 182px; padding: 6px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 6px 28px -8px rgba(10, 14, 20, .28);
    display: none;
  }
  .lang-menu.open { display: block; }
  .lang-menu button {
    display: flex; align-items: center; gap: 8px; width: 100%;
    font: inherit; font-size: 14px; text-align: left; cursor: pointer;
    color: var(--ink-2); background: transparent; border: 0;
    border-radius: 8px; padding: 7px 9px;
  }
  .lang-menu button:hover { background: var(--surface-2); color: var(--ink); }
  .lang-menu button[aria-checked="true"] { color: var(--accent); font-weight: 600; }
  .lang-menu .tick { width: 14px; height: 14px; flex: none; opacity: 0; }
  .lang-menu button[aria-checked="true"] .tick { opacity: 1; }
  .lang-menu .sub { margin-left: auto; font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }

  /* ---------- 冒頭 ---------- */
  .hero { padding: 0 0 8px; }
  h1 { font-size: clamp(30px, 6vw, 40px); line-height: 1.15; letter-spacing: -.025em;
       font-weight: 640; margin: 0 0 14px; }
  .lede { font-size: 16px; color: var(--ink-2); margin: 0 0 20px; max-width: 62ch; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font: 12px/1 ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    color: var(--ink-2); background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 11px;
  }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 32%, var(--line)); }
  .pill svg { width: 13px; height: 13px; }

  /* ---------- 節 ---------- */
  section { margin-top: 46px; }
  .main > section:first-of-type { margin-top: 0; }
  .rail .rail-site { margin-top: 30px; }
  .rail .eyebrow { margin-bottom: 10px; }
  /* 下段の 3 枚は、幅が有る時は横に並べる */
  .cards { display: grid; gap: 12px; }
  @media (min-width: 620px) { .cards { grid-template-columns: 1fr 1fr; } }
  .cards .card { margin: 0; }
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 14px;
  }
  .eyebrow svg { width: 14px; height: 14px; }
  h2 { font-size: 19px; letter-spacing: -.01em; font-weight: 620; margin: 0 0 10px; }
  p { margin: 0 0 12px; color: var(--ink-2); }
  p strong, li strong { color: var(--ink); font-weight: 600; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 12px; }

  /* ---------- 写せる欄 ---------- */
  .copy-row {
    display: flex; align-items: stretch; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--line-soft);
    border-radius: 11px; padding: 5px; margin: 4px 0 0;
  }
  .copy-row code {
    flex: 1; min-width: 0; padding: 9px 11px; overflow-x: auto; white-space: pre;
    font: 13px/1.6 ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    color: var(--ink);
  }
  .copy-btn {
    display: flex; align-items: center; gap: 6px; flex: none;
    font: inherit; font-size: 13px; font-weight: 550; cursor: pointer;
    color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 0 14px;
    transition: background .15s;
  }
  .copy-btn:hover { background: var(--accent-2); }
  .copy-btn.done { background: var(--ok); }
  .copy-btn svg { width: 14px; height: 14px; }
  code.i {
    background: var(--surface-2); border: 1px solid var(--line-soft);
    border-radius: 5px; padding: 1px 5px;
    font: 12.5px ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    color: var(--ink);
  }

  /* ---------- 手順 ---------- */
  ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; }
  ol.steps li {
    counter-increment: s; position: relative;
    padding: 0 0 18px 38px; color: var(--ink-2);
  }
  ol.steps li::before {
    content: counter(s);
    position: absolute; left: 0; top: 1px;
    width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 600;
    color: var(--accent); background: var(--accent-wash);
    border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  }
  ol.steps li::after {
    content: ""; position: absolute; left: 11.5px; top: 28px; bottom: 4px;
    width: 1px; background: var(--line);
  }
  ol.steps li:last-child { padding-bottom: 0; }
  ol.steps li:last-child::after { display: none; }

  /* ---------- 但し書き ---------- */
  .note {
    display: flex; gap: 11px;
    border: 1px solid var(--line); background: var(--surface-2);
    border-left: 3px solid var(--warn);
    border-radius: 4px var(--radius) var(--radius) 4px;
    padding: 14px 16px; margin: 14px 0 0; color: var(--ink-2); font-size: 14px;
  }
  .note svg { width: 16px; height: 16px; flex: none; margin-top: 4px; color: var(--warn); }

  a { color: var(--accent); text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
      text-underline-offset: 2px; }
  a:hover { text-decoration-color: currentColor; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 520px) {
    .copy-row { flex-wrap: wrap; }
    .copy-btn { width: 100%; padding: 9px; justify-content: center; }
  }
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <div class="topbar-inner">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 4v6a3 3 0 0 0 3 3h8"/><circle cx="5" cy="3" r="1.6"/>
        <circle cx="19" cy="13" r="1.6"/><path d="M12 13v5a3 3 0 0 0 3 3h4"/>
      </svg>
    </span>
    <span class="brand">Sunimori Tools</span>
    <span class="spacer"></span>

    <div class="lang">
      <button class="lang-btn" id="langBtn" aria-expanded="false" aria-haspopup="true"

             stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>
          <path d="M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18"/></svg>
        <span id="langNow">日本語</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="lang-menu" id="langMenu" role="menu" aria-labelledby="langBtn"></div>
    </div>
  </div>
</div>

<div class="wrap">

  <aside class="rail">
  <div class="hero">
    <h1>Java Impact Analyzer</h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="pills">
      <span class="pill" id="ver">1.0.0.202608241141</span>
      <span class="pill ok">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>
        </svg>
        <span data-i18n="signed">signed</span>
      </span>
      <span class="pill" data-i18n="offlineBadge">offline</span>
    </div>
  </div>

  <div class="rail-site">
    <p class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <span data-i18n="eyebrowSite"></span>
    </p>
    <p style="margin:0 0 6px" data-i18n="siteBody"></p>
    <div class="copy-row">
      <code id="siteUrl">https://sunimori.tools/eclipse/impact-analyzer/</code>
      <button class="copy-btn" type="button" data-copy="siteUrl">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2"/>
          <path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span data-i18n="copy">Copy</span>
      </button>
    </div>
  </div>
  </aside>

  <main class="main">

  <section>
    <p class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
      <span data-i18n="eyebrowInstall"></span>
    </p>
    <h2 data-i18n="installTitle"></h2>

    <div class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".6"/>
        <path d="M12 3 2 20h20z"/></svg>
      <span data-i18n="dropins"></span>
    </div>

    <ol class="steps" style="margin-top:18px">
      <li data-i18n="step1"></li>
      <li data-i18n="step2"></li>
      <li data-i18n="step3"></li>
      <li data-i18n="step4"></li>
    </ol>
  </section>

  <section>
    <p class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
      <span data-i18n="eyebrowTrust"></span>
    </p>
    <h2 data-i18n="trustTitle"></h2>
    <p data-i18n="trustBody"></p>

    <div class="card">
      <p style="margin:0 0 8px;font-size:13px;color:var(--ink-3)">
        CN=Sunimori, OU=Tools, O=Sunimori, C=JP
      </p>
      <div class="copy-row" style="margin:0">
<code id="fp">34:20:B1:D6:73:C4:00:7B:E2:72:7F:D3:C8:3B:61:32
40:4A:69:A4:B3:EF:90:66:6A:0B:DE:0B:49:BB:23:32</code>
        <button class="copy-btn" type="button" data-copy="fp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="12" height="12" rx="2"/>
            <path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          <span data-i18n="copy">Copy</span>
        </button>
      </div>
      <p style="margin:12px 0 0;font-size:13.5px" data-i18n="fpChannel"></p>
    </div>

    <div class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".6"/>
        <path d="M12 3 2 20h20z"/></svg>
      <span data-i18n="trustNote"></span>
    </div>
  </section>

  <section>
    <p class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16v12H4z"/><path d="M8 10l3 2-3 2"/><path d="M13 14h4"/></svg>
      <span data-i18n="eyebrowHarden"></span>
    </p>
    <h2 data-i18n="hardenTitle"></h2>
    <p data-i18n="hardenBody"></p>
    <div class="copy-row">
      <code id="ini">-Declipse.p2.unsignedPolicy=fail</code>
      <button class="copy-btn" type="button" data-copy="ini">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2"/>
          <path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span data-i18n="copy">Copy</span>
      </button>
    </div>
  </section>

  <section>
    <p class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/></svg>
      <span data-i18n="eyebrowUpdate"></span>
    </p>
    <h2 data-i18n="updateTitle"></h2>
    <p data-i18n="updateBody"></p>
  </section>

  <section class="cards">
    <div class="card">
      <h2 style="font-size:16px" data-i18n="reqTitle"></h2>
      <p style="margin:0" data-i18n="reqBody"></p>
    </div>
    <div class="card">
      <h2 style="font-size:16px" data-i18n="offlineTitle"></h2>
      <p style="margin:0" data-i18n="offlineBody"></p>
    </div>
    <div class="card">
      <h2 style="font-size:16px" data-i18n="supportTitle"></h2>
      <p style="margin:0" data-i18n="supportBody"></p>
    </div>

  </main>
</div>

<script>
(function () {

    now.textContent = meta ? meta.name : lang;
    menu.querySelectorAll("button").forEach(function (b) {
      b.setAttribute("aria-checked", String(b.dataset.lang === lang));
    });
  }

  function pick(lang) {
    current = lang;
    apply(lang);
    try { localStorage.setItem("st.lang", lang); } catch (e) { /* 保存できなくても使える */ }
  }

  function open() { menu.classList.add("open"); btn.setAttribute("aria-expanded", "true"); }
  function close() { menu.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }

  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (menu.classList.contains("open")) { close(); } else { open(); }
  });
  document.addEventListener("click", function (e) {
    if (!menu.contains(e.target) && !btn.contains(e.target)) { close(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { close(); }
  });

  // 起動時の言語: 前回の選択 → 閲覧環境の設定 → 日本語
  var saved = null;
  try { saved = localStorage.getItem("st.lang"); } catch (e) { /* 同上 */ }
  if (!saved) {
    var nav = (navigator.languages || [navigator.language || "ja"]).join(",").toLowerCase();
    var hit = LANGS.filter(function (l) { return nav.indexOf(l.id) >= 0; })[0];
    saved = hit ? hit.id : "ja";
  }
  pick(saved);

  // 帯は、少しでも巻いたら下辺の線を出す。常に出しておくと、
  // 一番上に居る時に画面を無意味に二分してしまう
  var topbar = document.getElementById("topbar");
  var onScroll = function () { topbar.classList.toggle("stuck", window.scrollY > 4); };
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  // ---- 写す釦 ----
  document.querySelectorAll("[data-copy]").forEach(function (b) {
    b.addEventListener("click", function () {
      var src = document.getElementById(b.getAttribute("data-copy"));
      var text = src.textContent.replace(/\s*\n\s*/g, " ").trim();
      var label = b.querySelector("[data-i18n]");
      var back = label ? label.innerHTML : "";
      var done = function () {
        b.classList.add("done");
        if (label) { label.innerHTML = (T[current] || T.en).copied; }
        setTimeout(function () {
          b.classList.remove("done");
          if (label) { label.innerHTML = back; }
        }, 1400);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        // 古い環境。選んだ状態にして手で写せるようにするだけでも意味がある
        var r = document.createRange();
        r.selectNodeContents(src);
        var s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
        done();
      }
    });
  });
})();
</script>
</body>
</html>
